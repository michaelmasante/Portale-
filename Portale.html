<!doctype html>
<html lang="it">
<link rel="icon" type="image/png" href="IMG/LOGHI/Logo.png">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Portale Servizi</title>


	<!-- CSS Specifico del Portale -->
	<link rel="stylesheet" href="CSS/Portal/Portale.css">
</head>
<body>

	<!-- Spazio per l'header condiviso -->
	<div id="header-placeholder"></div>

	<div class="page">
		<header class="top">
			<h1>Accedi ai Servizi</h1>
		</header>
		<div class="grid">

			<!-- Colonna Sinistra -->
			<div class="stack">
				<div class="tiles">

					<!-- Motori -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="Certificati.html" data-redirect="Certificati">
							<div class="icon-wrap" style="background:rgba(27,197,189,.1);color:var(--success)">
								<!-- Icona Motore (Engine) -->
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
									<path d="M3 10h2v7H3z" />
									<path d="M5 12h3" />
									<path d="M8 8h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8v-2H6v-6h2V8z" />
									<path d="M11 6v2" />
									<path d="M15 6v2" />
									<path d="M19 12h2v3h-2z" />
									<circle cx="13.5" cy="13" r="1.5" />
								</svg>
							</div>
							<p class="tile-title">Certificati</p>
						</a>
					</div>


					<!-- Certificazione Carichi -->
					<div class="card">
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(255,168,0,.1);color:var(--warning)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Carichi -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="#" data-redirect="UnioneFile">
							<div class="icon-wrap" style="background:rgba(246,78,96,.1);color:var(--danger)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" /><path d="M14 3v5h5" /><line x1="8" y1="13" x2="16" y2="13" /><line x1="8" y1="16.5" x2="13" y2="16.5" /></svg>
							</div>
							<p class="tile-title">UnioneFile</p>
						</a>
					</div>

					<!-- Controlli -->
					<div class="card">
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(54,153,255,.1);color:var(--primary)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- CheckList -->
					<div class="card stat-tile" style="background:var(--success)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
						<a aria-disabled="true" data-redirect="Prossimamente">Prossimamente</a>
					</div>

					<!-- Foto -->
					<div class="card stat-tile" style="background:var(--danger)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
						<div class="count">&nbsp;</div>
						<a aria-disabled="true" data-redirect="Prossimamente">Prossimamente</a>
					</div>
				</div>
			</div>

			<!-- Colonna Centrale (Logo Gruppo) -->
			<div class="card">
				<div class="activity-body">
					<img src="IMG/Portal/IvecoGroup.png" alt="Iveco Group Logo" class="center-img">
				</div>
			</div>

			<!-- Colonna Destra -->
			<div class="stack">
				<div class="tiles">
					<!-- Im -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(246,78,96,.1);color:var(--danger)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>

					<!-- Incompleti -->
					<div class="card">
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(255,168,0,.1);color:var(--warning)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Liv2 -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(27,197,189,.1);color:var(--success)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>

					<!-- IT Chat -->
					<div class="card">
						<a class="tile" aria-disabled="true" data-redirect="Prossimamente">
							<div class="icon-wrap" style="background:rgba(54,153,255,.1);color:var(--primary)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
							</div>
							<p class="tile-title">Prossimamente</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Mezzisollevamento -->
					<div class="card stat-tile" style="background:var(--warning)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
						<a aria-disabled="true" data-redirect="Prossimamente">Prossimamente</a>
					</div>

					<!-- Produzione -->
					<div class="card stat-tile" style="background:var(--primary)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-2.3 1.9) rotate(40 12 12)"><rect x="4.5" y="3" width="15" height="6.5" rx="1.5" /><path d="M10.5 9.5V19.5a1.5 1.5 0 0 0 3 0V9.5" /></g></svg>
						<div class="count">&nbsp;</div>
						<a aria-disabled="true" data-redirect="Prossimamente">Prossimamente</a>
					</div>
				</div>
			</div>

		</div>
	</div>
	<div id="footer-placeholder"></div>
	<!-- Script caricatore Header -->
	<script src="JS/Portal/header-loader.js"></script>
	<!-- Script Gestione Portale -->
	<script src="JS/Portal/Portal.js"></script>
</body>
</html>
