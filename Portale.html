<!doctype html>
<html lang="it">
<link rel="icon" type="image/png" href="IMG/LOGHI/Logo.png">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Portale Servizi</title>


	<!-- CSS Specifico del Portale -->
	<link rel="stylesheet" href="CSS/Portal/Portale.css">
</head>
<body>

	<!-- Spazio per l'header condiviso -->
	<div id="header-placeholder"></div>

	<div class="page">
		<header class="top">
			<h1>Accedi ai Servizi</h1>
		</header>
		<div class="grid">

			<!-- Colonna Sinistra -->
			<div class="stack">
				<div class="tiles">

					<!-- Motori -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="Motori.html" data-redirect="Motori">
							<div class="icon-wrap" style="background:rgba(27,197,189,.1);color:var(--success)">
								<!-- Icona Motore (Engine) -->
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
									<path d="M3 10h2v7H3z" />
									<path d="M5 12h3" />
									<path d="M8 8h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8v-2H6v-6h2V8z" />
									<path d="M11 6v2" />
									<path d="M15 6v2" />
									<path d="M19 12h2v3h-2z" />
									<circle cx="13.5" cy="13" r="1.5" />
								</svg>
							</div>
							<p class="tile-title">Motori</p>
						</a>
					</div>


					<!-- Certificazione Carichi -->
					<div class="card">
						<a class="tile" href="#" data-redirect="CertificazioneCarichi">
							<div class="icon-wrap" style="background:rgba(255,168,0,.1);color:var(--warning)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="1.5" /><line x1="8" y1="20.5" x2="16" y2="20.5" /><line x1="12" y1="16.5" x2="12" y2="20.5" /></svg>
							</div>
							<p class="tile-title">Certificazione Carichi</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Carichi -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="#" data-redirect="Carichi">
							<div class="icon-wrap" style="background:rgba(246,78,96,.1);color:var(--danger)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" /><path d="M14 3v5h5" /><line x1="8" y1="13" x2="16" y2="13" /><line x1="8" y1="16.5" x2="13" y2="16.5" /></svg>
							</div>
							<p class="tile-title">Carichi</p>
						</a>
					</div>

					<!-- Controlli -->
					<div class="card">
						<a class="tile" href="#" data-redirect="Controlli">
							<div class="icon-wrap" style="background:rgba(54,153,255,.1);color:var(--primary)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="11" rx="1.5" /><line x1="4" y1="7" x2="20" y2="7" /><line x1="9" y1="18" x2="15" y2="18" /><line x1="12" y1="14" x2="12" y2="18" /></svg>
							</div>
							<p class="tile-title">Controlli</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- CheckList -->
					<div class="card stat-tile" style="background:var(--success)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="5" rx="1" /><rect x="4" y="10" width="16" height="5" rx="1" /><rect x="4" y="16.5" width="16" height="5" rx="1" /></svg>
						<a href="#" data-redirect="CheckList">CheckList</a>
					</div>

					<!-- Foto -->
					<div class="card stat-tile" style="background:var(--danger)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg>
						<div class="count">&nbsp;</div>
						<a href="#" data-redirect="Foto">Foto</a>
					</div>
				</div>
			</div>

			<!-- Colonna Centrale (Logo Gruppo) -->
			<div class="card">
				<div class="activity-body">
					<img src="IMG/Portal/IvecoGroup.png" alt="Iveco Group Logo" class="center-img">
				</div>
			</div>

			<!-- Colonna Destra -->
			<div class="stack">
				<div class="tiles">
					<!-- Im -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="#" data-redirect="Im">
							<div class="icon-wrap" style="background:rgba(246,78,96,.1);color:var(--danger)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1" /><rect x="15" y="3" width="6" height="6" rx="1" /><rect x="9" y="15" width="6" height="6" rx="1" /><path d="M6 9v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9" /><path d="M12 13v2" /></svg>
							</div>
							<p class="tile-title">Im</p>
						</a>
					</div>

					<!-- Incompleti -->
					<div class="card">
						<a class="tile" href="#" data-redirect="Incompleti">
							<div class="icon-wrap" style="background:rgba(255,168,0,.1);color:var(--warning)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></svg>
							</div>
							<p class="tile-title">Incompleti</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Liv2 -->
					<div class="card">
						<div class="fab-group"></div>
						<a class="tile" href="#" data-redirect="Liv2">
							<div class="icon-wrap" style="background:rgba(27,197,189,.1);color:var(--success)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="16 12 12 8 8 12" /><line x1="12" y1="16" x2="12" y2="8" /></svg>
							</div>
							<p class="tile-title">Liv2</p>
						</a>
					</div>

					<!-- IT Chat -->
					<div class="card">
						<a class="tile" href="#" data-redirect="ITChat">
							<div class="icon-wrap" style="background:rgba(54,153,255,.1);color:var(--primary)">
								<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><line x1="8" y1="9" x2="16" y2="9" /><line x1="8" y1="13" x2="13" y2="13" /></svg>
							</div>
							<p class="tile-title">IT Chat</p>
						</a>
					</div>
				</div>

				<div class="tiles">
					<!-- Mezzisollevamento -->
					<div class="card stat-tile" style="background:var(--warning)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18" /><path d="M5 21V3l14 8H5" /><path d="M19 11v4" /><circle cx="19" cy="17" r="2" /></svg>
						<a href="#" data-redirect="Mezzisollevamento">Mezzisollevamento</a>
					</div>

					<!-- Produzione -->
					<div class="card stat-tile" style="background:var(--primary)">
						<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20" /><path d="M2 20V10l5 3V10l5 3V10l5 3v7" /><path d="M17 20v-9l3 2v7" /><path d="M19 7h1" /><path d="M19 4h1" /></svg>
						<div class="count">&nbsp;</div>
						<a href="#" data-redirect="Produzione">Produzione</a>
					</div>
				</div>
			</div>

		</div>
	</div>
	<div id="footer-placeholder"></div>
	<!-- Script caricatore Header -->
	<script src="JS/Portal/header-loader.js"></script>
	<!-- Script Gestione Portale -->
	<script src="JS/Portal/Portal.js"></script>
</body>
</html>
