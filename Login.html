<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accedi - Portale Servizi</title>
	<link rel="icon" type="image/png" href="IMG/LOGHI/Logo.png">

	<!-- CSS della pagina di accesso -->
	<link rel="stylesheet" href="CSS/Login/Login.css">
</head>
<body>

	<!-- Barra in alto: non usa Header.html perché per leggerlo servirebbe già il login -->
	<nav class="login-nav">
		<img src="IMG/LOGHI/Logo.png" alt="FPT Logo">
		<span>Portale Servizi</span>
	</nav>

	<main class="login-page">
		<section class="login-card">
			<h1>Accedi ai Servizi</h1>

			<div class="login-tabs" role="tablist" aria-label="Accesso">
				<button type="button" class="login-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login" data-form="login">Accedi</button>
				<button type="button" class="login-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register" data-form="register" tabindex="-1">Registrati</button>
			</div>

			<!-- Messaggi (errori in rosso, conferme in verde) -->
			<div class="login-message" id="login-message" aria-live="polite" hidden></div>

			<!-- Accedi -->
			<form id="form-login" class="login-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
				<label for="login-username">Nome utente</label>
				<input type="text" id="login-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="50" autofocus>

				<label for="login-password">Password</label>
				<div class="login-password">
					<input type="password" id="login-password" autocomplete="current-password" maxlength="128">
					<button type="button" class="login-eye" data-target="login-password" aria-label="Mostra la password">Mostra</button>
				</div>

				<button type="submit" class="login-submit">Accedi</button>
			</form>

			<!-- Registrati -->
			<form id="form-register" class="login-form" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
				<label for="reg-nome">Nome e cognome</label>
				<input type="text" id="reg-nome" autocomplete="name" maxlength="100">

				<label for="reg-username">Nome utente</label>
				<input type="text" id="reg-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="50">
				<span class="login-hint">Da 3 a 50 caratteri: lettere, numeri, punto, trattino o @.</span>

				<label for="reg-email">Email <span class="login-optional">(facoltativa)</span></label>
				<input type="email" id="reg-email" autocomplete="email" maxlength="150">

				<label for="reg-password">Password</label>
				<div class="login-password">
					<input type="password" id="reg-password" autocomplete="new-password" maxlength="128">
					<button type="button" class="login-eye" data-target="reg-password" aria-label="Mostra la password">Mostra</button>
				</div>
				<span class="login-hint">Almeno 8 caratteri.</span>

				<label for="reg-password2">Ripeti la password</label>
				<input type="password" id="reg-password2" autocomplete="new-password" maxlength="128">

				<button type="submit" class="login-submit">Registrati</button>
			</form>
		</section>
	</main>

	<script src="JS/Login/Login.js"></script>
</body>
</html>
