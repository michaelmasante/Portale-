<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accedi - Portale Servizi</title>
	<link rel="icon" type="image/png" href="IMG/LOGHI/Logo.png">

	<link rel="stylesheet" href="CSS/Login/Login.css?v=2">
</head>
<body>

	<nav class="login-nav">
		<img src="IMG/LOGHI/Logo.png" alt="FPT Logo">
		<span>Portale Servizi</span>
	</nav>

	<main class="login-page">
		<section class="login-card">
			<h1>Accedi ai Servizi</h1>

			<div class="login-message" id="login-message" aria-live="polite" hidden></div>

			<a class="login-microsoft" id="login-microsoft" href="API/Entra.ashx">
				<svg width="20" height="20" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
				<span>Accedi con Microsoft</span>
			</a>
			<p class="login-hint login-microsoft-nota">Usa il tuo account aziendale. Al primo accesso la richiesta va attivata da un amministratore.</p>

			<details class="login-admin" id="login-admin">
				<summary>Accesso amministratore</summary>
				<form id="form-login" class="login-form" novalidate>
					<label for="login-username">Nome utente</label>
					<input type="text" id="login-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="50">

					<label for="login-password">Password</label>
					<div class="login-password">
						<input type="password" id="login-password" autocomplete="current-password" maxlength="128">
						<button type="button" class="login-eye" data-target="login-password" aria-label="Mostra la password">Mostra</button>
					</div>

					<button type="submit" class="login-submit">Accedi</button>
				</form>
			</details>
		</section>
	</main>

	<script src="JS/Login/Login.js?v=2"></script>
</body>
</html>
